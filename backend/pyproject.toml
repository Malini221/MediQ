[project]
name = "mediq-backend"
version = "0.1.0"
description = "MediQ AI-Powered Caregiver Coordination Platform - Backend"
requires-python = ">=3.12"
dependencies = [
    # Core API & Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    
    # Validation & Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    
    # Database, ORM & Supabase
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "supabase>=2.4.3",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Background Tasks & Queues
    "celery>=5.3.6",
    "redis>=5.0.3",
    
    # HTTP Client
    "httpx>=0.27.0",
    
    # Local AI & ML (Free/Local Options Only)
    "faster-whisper>=1.0.1",
    "sentence-transformers>=2.6.1",
    "transformers>=4.39.3",
    "torch>=2.2.2"
]
